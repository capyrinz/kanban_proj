name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run Flake8 (strict, no suppressions)
        working-directory: backend
        run: python -m flake8 .

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run Unit Tests with coverage gate
        working-directory: backend
        run: >
          python -m pytest tests/test_unit.py -q
          --cov=app --cov-branch
          --cov-report=term-missing
          --cov-fail-under=80

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Verify backend imports and migrations
        working-directory: backend
        run: |
          python -c "from app.main import app; print('Build validation successful')"
          python -c "from alembic.config import Config; Config('alembic.ini'); print('Alembic config OK')"

  integration-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run Unit + Integration Tests with coverage report
        working-directory: backend
        run: >
          python -m pytest tests/test_unit.py tests/test_integration.py -q
          --cov=app --cov-branch
          --cov-report=term-missing
          --cov-report=json:coverage.json
      - name: Enforce coverage requirements (>=80% lines, >=70% branches)
        working-directory: backend
        run: python check_coverage.py coverage.json
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            backend/coverage.json
            backend/.coverage
          if-no-files-found: ignore

  e2e-tests:
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Run E2E tests (strict, with tracing on failure)
        working-directory: backend
        run: python -m pytest tests/test_e2e.py -q --tracing retain-on-failure
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: backend/test-results/
          if-no-files-found: ignore

  security-scan:
    needs: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
      - name: Run Bandit (static security analysis)
        run: bandit -r backend/app -q
      - name: Run pip-audit (dependency vulnerabilities)
        run: pip-audit -r backend/requirements.txt

  deploy:
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy Step Simulation
        run: |
          echo "All checks passed: lint, unit, build, integration, e2e, security"
          echo "Successfully deployed to Staging!"
          echo "Successfully deployed to Production after all passed checks!"
